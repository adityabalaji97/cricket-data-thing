name: Media cleanup

# Nightly: delete rendered slides and Reels nothing needs any more (scripts/media_gc.py: posted, expired, skipped and
# superseded carousels; the queue, the bench, site-note images and recent hand-made sets are kept). The carousels
# themselves are kept, so anything can be rendered again. Sundays also VACUUM FULL the two tables so the space goes
# back to the database plan (10 GB cap), not just back to the table.
on:
  schedule:
    - cron: "41 22 * * *"
  workflow_dispatch:

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Delete unneeded media
        run: |
          if [ "$(date -u +%u)" = "7" ]; then python scripts/media_gc.py --write --vacuum; else python scripts/media_gc.py --write; fi
