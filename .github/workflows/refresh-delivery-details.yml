name: Refresh delivery details

on:
  schedule:
    - cron: "30 23 * * *"  # Daily, 5am IST (11:30pm UTC)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest CSV from Dropbox
        run: |
          curl -L -o t20_bbb.csv "${{ secrets.DROPBOX_CSV_URL }}"
          echo "Downloaded $(du -sh t20_bbb.csv | cut -f1) CSV"

      # --format/--gender are required and authoritative: the loader never infers format from
      # the data. Adding the ODI, women's T20 and Test legs is chunk A2, and must wait until
      # the production database has migrations 001/002 applied and enough headroom for the
      # extra data (see MULTI_FORMAT_PLAN.md).
      - name: Run delivery details pipeline
        run: |
          python scripts/load_delivery_details_pipeline.py \
            --csv t20_bbb.csv \
            --format T20 \
            --gender male \
            --skip-validation

      - name: Update ELO ratings
        run: |
          python elo_update_service.py --calculate-missing
