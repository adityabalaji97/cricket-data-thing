name: Refresh delivery details

on:
  schedule:
    - cron: "30 23 * * *"  # Daily, 5am IST (11:30pm UTC)
  workflow_dispatch:

# Never let two refreshes overlap. They write the same tables, and a manual
# workflow_dispatch during the nightly window would otherwise race it.
concurrency:
  group: refresh-delivery-details
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Per-format legs: load + backfill + metadata.
      #
      # Steps 3, 4, 6, 7 (columns, players, sync, ELO) are table-wide, not
      # per-format -- running them once per leg would repeat the same work and
      # have two legs writing the same rows. So every leg but the last skips
      # them, and the last leg runs them once for everything loaded above.
      #
      # Step 5 (metadata) is the exception: it is per-format (it writes keys
      # scoped to the leg's format/gender), so every leg runs it. Skipping it on
      # the T20 leg meant the men's T20 dropdown values and delivery count were
      # never refreshed by the nightly job.
      #
      # Sequential, not a matrix: matrix jobs run in parallel and these all
      # write delivery_details.
      #
      # Each CSV is deleted after its leg -- the runner has ~14GB free and the
      # ODI file alone is ~700MB.
      # ------------------------------------------------------------------

      - name: "T20 (men): download"
        run: |
          curl -sSL -o t20_bbb.csv "${{ secrets.DROPBOX_T20_URL }}"
          echo "T20 CSV: $(du -sh t20_bbb.csv | cut -f1)"

      - name: "T20 (men): load + backfill"
        run: |
          python scripts/load_delivery_details_pipeline.py \
            --csv t20_bbb.csv \
            --format T20 \
            --gender male \
            --skip-validation \
            --skip-columns --skip-players --skip-sync --skip-elo
          rm -f t20_bbb.csv

      - name: "ODI (men): download"
        run: |
          curl -sSL -o odi_bbb.csv "${{ secrets.DROPBOX_ODI_URL }}"
          echo "ODI CSV: $(du -sh odi_bbb.csv | cut -f1)"

      # Last leg, so this one runs the table-wide steps for every format loaded
      # above. ELO is included here and partitions by (format, gender) itself.
      - name: "ODI (men): load + backfill, then table-wide steps"
        run: |
          python scripts/load_delivery_details_pipeline.py \
            --csv odi_bbb.csv \
            --format ODI \
            --gender male \
            --skip-validation
          rm -f odi_bbb.csv

      # T20 Primer metrics (Impact, RAA/WAA, win probability, WPA, leverage) for any
      # men's T20 match loaded above that has none yet. Uses the stored model version
      # (ml/models/primer + metric_models) and never refits, so older numbers stay put.
      - name: "T20 (men): Primer metrics for new matches"
        run: python scripts/compute_primer_metrics.py incremental --write

      # Usage tables (migration 004) keep 90 days of raw rows; weekly reports need no more.
      - name: Prune raw usage events
        if: always()
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1)
          with create_engine(url).begin() as c:
              for table in ("app_events", "mcp_call_log"):
                  n = c.execute(text(f"DELETE FROM {table} WHERE ts < now() - interval '90 days'")).rowcount
                  print(f"{table}: pruned {n}")
          PY

      # Women's T20 and Test legs are deliberately absent: their data has not
      # been loaded yet (phases B and C). Adding a leg here is what loads a
      # format for the first time, so do not add one before its chunk is ready.
      # Women's T20 additionally needs the gender-blind middle steps fixed --
      # update_players would create women's players as male. See
      # MULTI_FORMAT_PLAN.md.

      - name: Verify formats after refresh
        if: always()
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1)
          with create_engine(url).connect() as c:
              for row in c.execute(text(
                  "SELECT format, gender, count(*) AS matches, max(date) AS latest "
                  "FROM matches GROUP BY 1,2 ORDER BY 1,2"
              )):
                  print(f"{row.format}/{row.gender}: {row.matches} matches, latest {row.latest}")
              size = c.execute(text("SELECT pg_database_size(current_database())")).scalar()
              print(f"Database size: {size / 1e9:.2f} GB of the 10 GB Essential-1 cap")
              if size > 8e9:
                  print("::warning::Database is over 8 GB -- plan the next storage step before the 10 GB cap")
          PY
