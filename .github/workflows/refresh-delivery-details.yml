name: Refresh delivery details

on:
  schedule:
    # 01:47 IST (20:17 UTC), to be done by ~5am IST. GitHub starts scheduled runs late -- the old
    # 23:30 UTC ("5am IST") cron began 1h40m-3h late in Sep 2026 and finished ~07:00-08:15 IST --
    # and :00 / :30 are its busiest minutes. Matches ending after ~2am IST (Americas) load the next
    # night; trigger workflow_dispatch to load them sooner.
    - cron: "17 20 * * *"
  workflow_dispatch:

# Never let two refreshes overlap. They write the same tables, and a manual
# workflow_dispatch during the nightly window would otherwise race it.
concurrency:
  group: refresh-delivery-details
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Per-format legs: load + backfill + metadata.
      #
      # Steps 3, 4, 6, 7 (columns, players, sync, ELO) are table-wide, not
      # per-format -- running them once per leg would repeat the same work and
      # have two legs writing the same rows. So every leg but the last skips
      # them, and the last leg runs them once for everything loaded above.
      #
      # Step 5 (metadata) is the exception: it is per-format (it writes keys
      # scoped to the leg's format/gender), so every leg runs it. Skipping it on
      # the T20 leg meant the men's T20 dropdown values and delivery count were
      # never refreshed by the nightly job.
      #
      # Sequential, not a matrix: matrix jobs run in parallel and these all
      # write delivery_details.
      #
      # Each CSV is deleted after its leg -- the runner has ~14GB free and the
      # ODI file alone is ~700MB.
      # ------------------------------------------------------------------

      - name: "T20 (men): download"
        run: |
          curl -sSL -o t20_bbb.csv "${{ secrets.DROPBOX_T20_URL }}"
          echo "T20 CSV: $(du -sh t20_bbb.csv | cut -f1)"

      - name: "T20 (men): load + backfill"
        run: |
          python scripts/load_delivery_details_pipeline.py \
            --csv t20_bbb.csv \
            --format T20 \
            --gender male \
            --skip-validation \
            --skip-columns --skip-players --skip-sync --skip-elo
          rm -f t20_bbb.csv

      - name: "ODI (men): download"
        run: |
          curl -sSL -o odi_bbb.csv "${{ secrets.DROPBOX_ODI_URL }}"
          echo "ODI CSV: $(du -sh odi_bbb.csv | cut -f1)"

      # Last leg, so this one runs the table-wide steps for every format loaded
      # above. ELO is included here and partitions by (format, gender) itself.
      - name: "ODI (men): load + backfill, then table-wide steps"
        run: |
          python scripts/load_delivery_details_pipeline.py \
            --csv odi_bbb.csv \
            --format ODI \
            --gender male \
            --skip-validation
          rm -f odi_bbb.csv

      # Cricsheet fallback (scripts/load_cricsheet.py): men's T20Is, ODIs and main-league T20s
      # from Cricsheet's last-7-days archive that the CSVs above have not delivered yet --
      # result, scorecard and basic stats, marked data_source='cricsheet'. Runs after the legs so
      # anything the CSVs had tonight is skipped; the sync upgrades the rest when the CSV catches
      # up. Never blocks the rest of the run.
      - name: Cricsheet fallback for matches the CSVs lack
        continue-on-error: true
        run: python scripts/load_cricsheet.py --days 7

      # T20 Primer metrics (Impact, RAA/WAA, win probability, WPA, leverage) for any
      # men's T20 match loaded above that has none yet. Uses the stored model version
      # (ml/models/primer + metric_models) and never refits, so older numbers stay put.
      - name: "T20 (men): Primer metrics for new matches"
        run: python scripts/compute_primer_metrics.py incremental --write

      # The materialised name lookups (migrations 011, 012). player_name_spellings lists every name
      # in the ball tables, so it must refresh after the loads above; the alias views change only
      # through migrations and the alias scripts (which refresh them too), so for them this is the
      # safety net.
      - name: Refresh player alias views
        run: |
          python - <<'PY'
          from database import get_session
          from services.player_aliases import refresh_alias_views
          refresh_alias_views(next(get_session()))
          print("player alias views refreshed")
          PY

      # Partnership stands (migration 016) for matches loaded above: the pair at the crease, rebuilt
      # from the striker sequence because the feed's non_striker is unreliable around wickets. After
      # the alias refresh (names are canonical); a rename via the alias scripts needs --full.
      - name: Build partnership stands for new matches
        run: python scripts/build_partnership_stands.py

      # New data: bump the data version so every cached query result (query_cache, migration
      # 009) is stale from now on, and drop results cached against older versions.
      - name: Invalidate the query cache
        run: |
          python - <<'PY'
          from database import get_session
          from services.query_cache import bump_data_version, prune
          db = next(get_session())
          print("data_version:", bump_data_version(db), "| pruned:", prune(db))
          PY

      # Rankings payloads are cached in query_cache, which the step above just invalidated; a cold
      # player ranking card needs seven league-wide computations (~28 s, 503s in production), so
      # refill the windows the pages ask for by default. Never blocks the rest of the run.
      - name: Warm global rankings
        continue-on-error: true
        run: python scripts/warm_rankings.py

      # Match-preview stories are cached in query_cache too, so the step above just made every one
      # stale; the first viewer of a fixture waited for ~30 queries (up to ~7 s). Rebuild the stories
      # for fixtures in the next 36 hours, as the home page's links and a direct visit open them.
      - name: Warm match-preview stories
        continue-on-error: true
        run: python scripts/warm_previews.py --hours 36

      # Reddit/X-ready content packs for newly loaded matches (services/content_packs.py): record
      # and career-best stats plus the win-probability series, queued in /admin for a human to
      # post. Jev ranks share-worthiness when the TYPESAFE_API_KEY secret is set; without it the
      # packs are ranked by the size of the record. Never blocks the rest of the run.
      - name: Content packs for new matches
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python scripts/generate_content_packs.py --days 10

      # Hindsight Bot drafts Notes (services/note_drafts.py): recaps of newly loaded matches, which
      # reuse the packs' facts and charts (so this runs after them), then previews of fixtures in
      # the next 36 hours. Drafts only -- nothing publishes until the admin does it in /admin/notes.
      # Jev picks the preview headline when TYPESAFE_API_KEY is set. Never blocks the rest of the run.
      - name: Draft notes (recaps, then previews)
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python scripts/draft_notes.py --days 10

      # Instagram match-day posts (scripts/ig_match_day.py): a preview for India's fixtures in the next 2 days and a
      # "what decided it" post for matches just played, queued in the admin Instagram tab. Slides are screenshots of
      # the live site's /ig/<id>/<n> in headless Chrome (scripts/render_ig_slides.mjs needs Node 22's WebSocket).
      - name: Set up Node for the slide renderer
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instagram match-day posts
        continue-on-error: true
        env:
          CHROME: google-chrome
        run: python scripts/ig_match_day.py --team India

      # Usage tables (migration 004) keep 90 days of raw rows; weekly reports need no more.
      - name: Prune raw usage events
        if: always()
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1)
          with create_engine(url).begin() as c:
              for table in ("app_events", "mcp_call_log"):
                  n = c.execute(text(f"DELETE FROM {table} WHERE ts < now() - interval '90 days'")).rowcount
                  print(f"{table}: pruned {n}")
          PY

      # Weekly adoption check-in (growth plan): on Mondays the usage report lands on this run's
      # summary page in the Actions tab.
      - name: Weekly usage report (Mondays)
        if: always()
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            {
              echo '## Hindsight weekly usage'
              echo '```'
              python scripts/usage_report.py --weeks 8
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Women's T20 and Test legs are deliberately absent: their data has not
      # been loaded yet (phases B and C). Adding a leg here is what loads a
      # format for the first time, so do not add one before its chunk is ready.
      # Women's T20 additionally needs the gender-blind middle steps fixed --
      # update_players would create women's players as male. See
      # MULTI_FORMAT_PLAN.md.

      - name: Verify formats after refresh
        if: always()
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          url = os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1)
          with create_engine(url).connect() as c:
              for row in c.execute(text(
                  "SELECT format, gender, count(*) AS matches, max(date) AS latest "
                  "FROM matches GROUP BY 1,2 ORDER BY 1,2"
              )):
                  print(f"{row.format}/{row.gender}: {row.matches} matches, latest {row.latest}")
              size = c.execute(text("SELECT pg_database_size(current_database())")).scalar()
              print(f"Database size: {size / 1e9:.2f} GB of the 10 GB Essential-1 cap")
              if size > 8e9:
                  print("::warning::Database is over 8 GB -- plan the next storage step before the 10 GB cap")
          PY
