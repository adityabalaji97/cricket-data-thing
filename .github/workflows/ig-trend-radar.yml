name: Instagram trend radar

# Each morning: the players in this morning's cricket headlines (Reddit, Cricinfo, Google News) as 'Trending today'
# debate posts in the admin Instagram queue (scripts/trend_radar.py). Slides are screenshots of the live site's
# /ig/<id>/<n> in headless Chrome. Queued only: nothing is posted.
on:
  schedule:
    # GitHub starts scheduled runs late (by ~7 hours on 6-7 Oct 2026), most of all on the hour. 02:47 IST so the
    # posts are queued by morning even when late; 09:00 IST as a backup that does nothing if the first one ran.
    - cron: "17 21 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CHROME: google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg for Instagram Reels
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Queue trending posts
        id: radar
        run: python scripts/trend_radar.py --top 3 ${{ github.event_name == 'schedule' && '--once-a-day' || '' }}
      # The day's plan as a GitHub issue (closing yesterday's): it lands in the owner's email and GitHub app.
      - name: Morning digest issue
        if: ${{ always() && steps.radar.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ig_digest.py > digest.md 2> digest.err || { cat digest.err; exit 1; }
          title=$(grep '^TITLE: ' digest.err | tail -1 | sed 's/^TITLE: //')
          gh label create ig-digest --color b6f24a --description "Instagram morning plan" 2>/dev/null || true
          for n in $(gh issue list --label ig-digest --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by today's plan." >/dev/null
          done
          gh issue create --title "$title" --label ig-digest --body-file digest.md
